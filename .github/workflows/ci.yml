# runs the tests on every pull request
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # astral is the company behind uv
      - uses: astral-sh/setup-uv@v10.2.0
      - run: make install
      - run: make check
