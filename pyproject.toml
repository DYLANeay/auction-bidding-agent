# Shopping list of the project: which Python version and which libraries we need

[project]
name = "smaug-auction-agent"
version = "0.1.0"
description = "Auction bidding agent for the IKT110 dnd_auction_game battle."
requires-python = ">=3.12,<3.13"
dependencies = [
    "dnd_auction_game==0.6.0",   # the teacher's game, pinned to the server version
    "numpy",
]

[dependency-groups]
dev = ["pytest"]                 # tests only
tools = ["rich", "matplotlib"]   # TUI and plots, never imported by the agent

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smaug"]         # our code lives in src/smaug

[tool.pytest.ini_options]
testpaths = ["tests"]   # only our tests, never the teacher's tests in context/

[tool.pyright]
venvPath = "."
venv = ".venv"   # so the editor finds the installed packages
